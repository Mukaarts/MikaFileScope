name: Release

# Läuft auf Tags der Form v*. Baut das Bundle, erzeugt das DMG und hängt es an das
# GitHub-Release. Der appcast-Eintrag wird NICHT automatisch erzeugt: Er braucht den
# privaten Signaturschlüssel, der bewusst nicht in der CI liegt.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Der Runner bringt mehrere Xcode-Fassungen mit und wählt nicht immer die
      # neueste. Das Paket verlangt Swift-Tools 6.0.
      - name: Neueste Xcode-Fassung wählen
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Verwende $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          swift --version

      - name: Version aus dem Tag ableiten
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prüfen, dass die Info.plist zum Tag passt
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$PLIST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "FEHLER: Tag ${{ steps.version.outputs.version }} und Info.plist $PLIST_VERSION stimmen nicht überein." >&2
            exit 1
          fi

      - name: Tests
        run: swift test

      - name: Universelles Bundle bauen
        run: bash scripts/build.sh --universal

      - name: DMG erzeugen
        run: |
          brew install create-dmg
          bash scripts/create-dmg.sh

      - name: An das Release hängen
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.dmg
          fail_on_unmatched_files: true

      - name: Erinnerung an den appcast
        run: |
          echo "::notice::Das Release ist erzeugt. Der appcast-Eintrag fehlt noch —"
          echo "::notice::sign_update auf das DMG anwenden und appcast.xml auf main UND master ergänzen."
